name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build and test
        run: |
          xcodebuild test \
            -project FeedApp.xcodeproj \
            -scheme FeedApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skip-testing:FeedAppUITests
