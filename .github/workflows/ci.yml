name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build and test
        run: |
          xcodebuild test \
            -project FeedApp.xcodeproj \
            -scheme FeedApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -skip-testing:FeedAppUITests
